# Upstreams go through variables so nginx resolves them per request with
# Docker's DNS. With a bare hostname it refuses to start while a service is
# missing, and never re-resolves after a container is recreated. The names
# carry the `lumia-` prefix because this container may also sit on a network
# shared with other stacks (Dokploy's), where `frontend` would be ambiguous.
resolver 127.0.0.11 valid=30s;

# Variants are immutable (a signed URL names its source and processing), so
# entries can stay long; max_size bounds the disk they take.
proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images_cache:10m
	max_size=2g inactive=30d use_temp_path=off;

server {
	listen 80;
	server_name _;

	location /api/ {
		# A photo is at most 20 MiB; the rest is multipart overhead. Anything
		# bigger is rejected by the backend with the API's own error shape.
		client_max_body_size 21m;

		set $backend_upstream lumia-backend:8000;
		proxy_pass http://$backend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# No fallback to the SPA on purpose: an unresponsive backend has to
		# surface as a gateway error, never as the app's HTML with a 200.
	}

	location /images/ {
		# Forwarded untouched: imgproxy is configured with the /images prefix
		# (IMGPROXY_PATH_PREFIX), so no rewrite is needed.
		set $transformer_upstream lumia-transformer:8080;
		proxy_pass http://$transformer_upstream;
		proxy_set_header Host $host;

		proxy_cache images_cache;
		proxy_cache_key $uri;
		# Only successful variants are cached; an error for a missing original
		# must not outlive the original being uploaded.
		proxy_cache_valid 200 30d;
		proxy_cache_lock on;
		add_header X-Cache-Status $upstream_cache_status always;
	}

	location / {
		set $frontend_upstream lumia-frontend:80;
		proxy_pass http://$frontend_upstream;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
