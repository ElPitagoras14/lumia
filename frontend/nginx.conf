server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Hashed filenames identify their content: cache long, immutably.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		try_files $uri =404;
	}

	# The entry document is always revalidated, so a new build is visible on
	# a plain reload.
	location = /index.html {
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	# Client-side routing: any path that is not a real file falls back to the
	# app shell. /api and /images never reach this server; the edge nginx
	# routes them elsewhere and has no fallback of its own.
	location / {
		add_header Cache-Control "no-cache" always;
		try_files $uri /index.html;
	}
}
